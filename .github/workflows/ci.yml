name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "1.24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race ./...

  build-lambda:
    name: Build Lambda binary (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build static binary for Lambda
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o bin/shimmy-sandbox-linux-amd64 \
            ./cmd/shimmy-sandbox

      - name: Verify binary
        run: |
          file bin/shimmy-sandbox-linux-amd64
          ls -lh bin/shimmy-sandbox-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: shimmy-sandbox-linux-amd64
          path: bin/shimmy-sandbox-linux-amd64
